title = "Repository secret detection policy"


# ============================================================
# Mantener TODAS las reglas incorporadas de Gitleaks
# ============================================================

[extend]
useDefault = true


# ============================================================
# Regla custom:
# PASSWORD=...
# API_KEY=...
# TOKEN=...
# CLIENT_SECRET=...
# etc.
# ============================================================

[[rules]]
id = "hardcoded-secret-assignment"
description = "Hardcoded credential assigned to a common secret variable"

regex = '''(?i)(?:password|passwd|pwd|secret|token|api[_-]?key|client[_-]?secret|access[_-]?key)\s*[:=]\s*["']?([^\s"'`;,#]{8,})'''

secretGroup = 1

keywords = [
  "password",
  "passwd",
  "pwd",
  "secret",
  "token",
  "api_key",
  "apikey",
  "api-key",
  "client_secret",
  "access_key"
]


# Valores que claramente son placeholders, no secretos reales.
[[rules.allowlists]]
regexTarget = "secret"

regexes = [
  '''^\$\{[A-Za-z_][A-Za-z0-9_]*\}$''',
  '''^\$\{[A-Za-z_][A-Za-z0-9_]*:-\}$''',
  '''^\$\{[A-Za-z_][A-Za-z0-9_]*:\}$''',
  '''^%[A-Za-z_][A-Za-z0-9_]*%$''',
  '''^<[^>]+>$''',
  '''(?i)^(?:changeme|change_me|replace_me|dummy|example|example_value|your[_-].+)$'''
]


[[rules.allowlists]]
condition = "AND"
regexTarget = "secret"
paths = ['''(^|/)application\.example\.yml$''']
regexes = ['''^configured-outside-repository$''']

[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''\.java$''']
regexes = ['''(?i)^(?:password|pwd)\s*=\s*[A-Za-z_][A-Za-z0-9_]*\.getPassword\(\)$''']

[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''\.(?:ps1|md)$''']
regexes = ['''(?i)^(?:password|pwd)\s*=\s*\$[A-Za-z_][A-Za-z0-9_]*\.GetNetworkCredential\(\)\.Password$''']

[[rules.allowlists]]
regexTarget = "line"

regexes = [
  '''^\s*password\s*=\s*os\.getenv\("[A-Z][A-Z0-9]*(?:_[A-Z][A-Z0-9]*)+",\s*(?:""|None)\),?\s*$'''
]


# ============================================================
# Regla custom:
# Connection strings
#
# Server=x;
# User Id=user;
# Password=SUPERSECRET;
#
# También detecta Pwd=
# ============================================================

[[rules]]
id = "connection-string-password"
description = "Hardcoded password inside a database connection string"

regex = '''(?i)(?:password|pwd)\s*=\s*([^; \t\r\n"']{4,})'''

secretGroup = 1


[[rules.allowlists]]
regexTarget = "secret"

regexes = [
  '''^\$\{[A-Za-z_][A-Za-z0-9_]*\}$''',
  '''^\$\{[A-Za-z_][A-Za-z0-9_]*:\}$''',
  '''^%[A-Za-z_][A-Za-z0-9_]*%$''',
  '''^<[^>]+>$''',
  '''(?i)^(?:changeme|change_me|replace_me|dummy|example|example_value|your[_-].+)$'''
]


[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''\.java$''']
regexes = ['''(?i)^(?:password|pwd)\s*=\s*[A-Za-z_][A-Za-z0-9_]*\.getPassword\(\)$''']

[[rules.allowlists]]
condition = "AND"
regexTarget = "line"
paths = ['''\.java$''']
regexes = ['''^\s*(?:this\.)?password\s*=\s*[A-Za-z_][A-Za-z0-9_]*;\s*$''']

[[rules.allowlists]]
condition = "AND"
regexTarget = "match"
paths = ['''\.(?:ps1|md)$''']
regexes = ['''(?i)^(?:password|pwd)\s*=\s*\$[A-Za-z_][A-Za-z0-9_]*\.GetNetworkCredential\(\)\.Password$''']

[[rules.allowlists]]
regexTarget = "line"

regexes = [
  '''^\s*password\s*=\s*os\.getenv\("[A-Z][A-Z0-9]*(?:_[A-Z][A-Z0-9]*)+",\s*(?:""|None)\),?\s*$'''
]


# ============================================================
# Regla custom:
# Credenciales embebidas en URL
#
# postgres://user:password@host/db
# redis://user:password@host
# etc.
# ============================================================

[[rules]]
id = "credential-in-url"
description = "Password embedded directly in an URI"

regex = '''(?i)[a-z][a-z0-9+.-]*://[^:/\s]+:([^@/\s]{4,})@'''

secretGroup = 1


[[rules.allowlists]]
regexTarget = "secret"

regexes = [
  '''^\$\{[A-Za-z_][A-Za-z0-9_]*\}$''',
  '''^%[A-Za-z_][A-Za-z0-9_]*%$''',
  '''^<[^>]+>$''',
  '''(?i)^(?:changeme|change_me|replace_me|dummy|example|example_value|your[_-].+)$'''
]
